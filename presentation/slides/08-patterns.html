    <h1>Patterns That Work</h1>
    <ul>
      <li>Read first, edit second (show existing patterns)</li>
      <li>Specific prompts > vague prompts</li>
      <li>Break big tasks into small chunks</li>
      <li>Use factory patterns for testability</li>
      <li>Centralize config, no magic strings</li>
      <li>Type hints everywhere (AI reads them)</li>
